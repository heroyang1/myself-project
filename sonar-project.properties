# SonarQube 项目配置
# 基于 2026-08 测试落地经验提炼的自定义质量门禁规则
# 运行：mvn sonar:sonar -Dsonar.projectKey=osh-backend

# === 项目基本信息 ===
sonar.projectKey=osh-backend
sonar.projectName=OSH Backend
sonar.sources=backstage-admin/src/main,backstage-system/src/main,backstage-common/src/main,backstage-framework/src/main
sonar.tests=backstage-admin/src/test,backstage-system/src/test
sonar.java.binaries=*/target/classes
sonar.java.test.binaries=*/target/test-classes
sonar.sourceEncoding=UTF-8
sonar.java.source=8

# === 排除项（不参与分析） ===
sonar.exclusions=**/target/**,**/node_modules/**,backstage-flink/**,**/generated/**

# === 质量门禁规则（基于本次修复经验） ===

# 1. CAS/原子操作返回值必须被检查
# 背景：markSuccess/atomicIncrement 返回 0 时若未检查将导致静默失败
# 关联：OrderEntitlementTaskService.processOrder L95, OshGroupServerServiceImpl L1722
# 规则：所有方法名含 "atomic|cas|increment|claim" 的 Mapper 方法调用必须对返回值做条件判断
# 实现方式：SonarQube 自定义规则或 ArchUnit（见 backstage-system/src/test/java/.../ArchRulesTest.java）

# 2. ThreadLocalUtil.get 必须使用双参数签名
# 背景：单参数版本在类型不明确时可能返回 null 或类型转换异常
# 关联：ThreadLocalUtil.java, ConcurrencySafetyTest
# 规则：禁止调用 ThreadLocalUtil.get(String) 单参数版本，强制使用 get(String, Class<T>)
# 实现方式：grep CI 检查或 ArchUnit 调用约束

# 3. @Transactional 必须指定 rollbackFor
# 背景：默认只回滚 unchecked exception，checked exception 不回滚导致数据不一致
# 关联：OshGroupServerServiceImpl.handlePaymentSuccess
# 规则：所有 @Transactional 注解必须包含 rollbackFor = Exception.class
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=squid:S2229
sonar.issue.ignore.multicriteria.e1.resourceKey=**/test/**

# 4. Mockito 测试中 int 返回值必须显式配置
# 背景：Mockito 默认返回 0，源码中 != 1 判断会误抛异常
# 关联：PaymentScenarioTest, MiddlewareFailoverTest (markSuccess mock)
# 规则：测试代码中对返回 int 的 Mapper 方法 mock 必须显式 thenReturn(1)
# 实现方式：Code Review checklist + Pitest 变异测试验证

# 5. 分布式锁注解参数一致性
# 背景：@DistributeLock(waitTime=0) 走 tryLock 分支，Mock 必须匹配
# 关联：DistributeLockAspect.java L93-109, ConcurrencySafetyTest
# 规则：@DistributeLock 使用非默认参数时，注释中必须标注走哪个分支
# 实现方式：Code Review checklist

# === 覆盖率配置 ===
sonar.coverage.jacoco.xmlReportPaths=*/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=*/target/surefire-reports

# === 变异测试（Pitest 集成） ===
# 运行：mvn pitest:mutationCoverage -pl backstage-system
# 报告：backstage-system/target/pit-reports/index.html
# 目标：支付/拼团 Service 层变异杀死率 > 70%

# === 质量门禁阈值 ===
# 新增代码覆盖率 >= 80%
# 新增代码重复率 <= 3%
# 无新增 Blocker/Critical 级别问题
# 变异测试杀死率 >= 70%（核心支付/拼团模块）
