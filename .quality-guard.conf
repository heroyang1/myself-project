# ============================================================
# .quality-guard.conf — Code Quality Guard Configuration
# ============================================================
# 通用化质量门禁配置文件。脚本 code-quality-guard.sh 读取此文件
# 决定哪些字段需要特殊检查，而非硬编码。
# 格式: key=value（管道 | 分隔列表项，# 开头为注释）
# ============================================================

# ── 必填字段 ──────────────────────────────────────────────
# 对于所有含 insert 操作的实体，若实体类包含以下字段，
# 则 Service insert 路径必须调用对应 setter，且 VO 层必须暴露。
REQUIRED_FIELDS=no

# ── 类型检查字段 ──────────────────────────────────────────
# 对这些字段执行 DDL 列类型 vs Java 实体字段类型的一致性检查。
TYPE_CHECK_FIELDS=resource_type

# ── 枚举文件路径 ──────────────────────────────────────────
# 需要进行"未使用枚举值"追踪的枚举类路径（相对于项目根目录）。
ENUM_FILES=backstage-common/src/main/java/com/backstage/common/enums/ResourceCodePrefixEnum.java

# ── 扫描目录 ──────────────────────────────────────────────
# Service / Entity / VO 的主要扫描路径
SERVICE_DIR=backstage-system
ENTITY_SEARCH_DIR=backstage-system
DDL_DIR=sql
