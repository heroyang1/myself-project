name: PR Build Check

on:
  pull_request:
    branches:
      - 'qa/**'
      - 'release/**'
      - 'main'
      - 'master'

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true


env:
  JAVA_VERSION: '17'

jobs:
  process-guard:
    name: Spec & Process Guard
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title (Conventional Commits)
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request?.title || '';
            // 与 AGENTS.md 提交规范对齐：feat|fix|refactor|docs|test|chore 等 type + 可选 scope + !（BREAKING）
            const pattern = /^(feat|fix|refactor|docs|test|chore|build|perf|ci|style|revert)(\([^)]+\))?!?: .+/;
            if (!pattern.test(title)) {
              core.setFailed(
                `PR title does not match Conventional Commits: "${title}"\n` +
                `Required format: <type>(<scope>)?: <subject>, e.g. "fix(group): CAS失败后退款重复触发"\n` +
                `Allowed types: feat fix refactor docs test chore build perf ci style revert`
              );
            }

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # 扫描 PR 引入的 commit，拦截 token/密码/私钥入仓（AGENTS.md 禁则的机器拦截点）。
        # 组织（Organization）账户需额外配置 repo/org secret: GITLEAKS_LICENSE；个人账户可省略。
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect OpenSpec exemption
        id: exempt
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const exempt = /OpenSpec-Exempt:\s*true/i.test(body) && /Reason:\s*\S+/i.test(body);
            core.setOutput('exempt', exempt ? 'true' : 'false');

      - name: Verify AI process files and OpenSpec change
        env:
          BASE_REF: origin/${{ github.base_ref }}
          ALLOW_OPENSPEC_EXEMPT: ${{ steps.exempt.outputs.exempt }}
        run: bash scripts/verify-ai-process.sh

      - name: Code quality guard (DDL/no-field/entity checks)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/code-quality-guard.sh

  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run core test suites
        run: >
          mvn test -pl backstage-common,backstage-framework,backstage-system,backstage-admin -am
          -Dtest='PaymentScenarioTest,GroupBuyingScenarioTest,SecurityBoundaryTest,BoundaryValueTest,MiddlewareFailoverTest,EquivalenceClassTest,ConcurrencySafetyTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

      # 断言 ArchUnit 护栏文件与冻结基线目录均已入 git 索引；
      # 保留下方 failIfNoSpecifiedTests=false 让多模块聚合不误伤，但"测试失踪即静默跳过"由本步骤兜住。
      - name: Assert ArchUnit test files present
        run: |
          missing=0
          for f in \
            backstage-admin/src/test/java/com/backstage/architecture/LayeredArchitectureTest.java \
            backstage-admin/src/test/java/com/backstage/architecture/CodingConventionArchitectureTest.java; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::$f 缺失；ArchUnit 护栏失效，禁止静默跳过。请 git add 后重新提交。"
              missing=1
            fi
          done
          if [ ! -d backstage-admin/archunit-store ]; then
            echo "::error::FreezingArchRule 基线目录 backstage-admin/archunit-store/ 缺失；首次运行会现建基线把当时全部存量洗白。请本地跑 mvn -B test -pl backstage-admin -am -Dtest='*ArchitectureTest' 生成后 git add 提交。"
            missing=1
          fi
          exit $missing

      # 架构护栏（ArchUnit）：分层方向 + 编码约定，失败即阻断 PR
      - name: Architecture guardrail (ArchUnit)
        run: >
          mvn -B test -pl backstage-admin -am
          -Dtest='LayeredArchitectureTest,CodingConventionArchitectureTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      # 文件行数：仅告警不阻断（项目未设硬行数门禁，多模块路径）
      - name: File size advisory (non-blocking)
        shell: bash
        run: |
          threshold=300
          found=0
          for f in $(find backstage-*/src/main/java -name '*.java' 2>/dev/null); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt "$threshold" ]; then
              echo "::warning file=$f::$f 有 $lines 行（参考上限 $threshold，不阻断）"
              found=$((found+1))
            fi
          done
          echo "超过 $threshold 行的文件共 $found 个（仅告警）。拆分指南见 docs/ai/conventions/。"

      # 文档新鲜度：仅告警不阻断（需 fetch-depth: 0 才能取到 git 历史）
      - name: Doc freshness advisory (non-blocking)
        shell: bash
        run: |
          for f in $(find docs/design -name '*.md' 2>/dev/null); do
            last_mod=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo "")
            [ -z "$last_mod" ] && continue
            now=$(date +%s)
            days_old=$(( (now - last_mod) / 86400 ))
            if [ "$days_old" -gt 60 ]; then
              echo "::warning file=$f::$f 已 ${days_old} 天未更新，可能过期"
            fi
          done

      - name: Build backend
        run: mvn clean install -DskipTests -pl '!backstage-flink'

      - name: Verify jar exists
        run: test -f backstage-admin/target/backstage-admin.jar
