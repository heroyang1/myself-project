name: PR Build Check

on:
  pull_request:
    branches:
      - 'qa/**'
      - 'release/**'
      - 'main'
      - 'master'

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true


env:
  JAVA_VERSION: '17'

jobs:
  process-guard:
    name: Spec & Process Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect OpenSpec exemption
        id: exempt
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const exempt = /OpenSpec-Exempt:\s*true/i.test(body) && /Reason:\s*\S+/i.test(body);
            core.setOutput('exempt', exempt ? 'true' : 'false');

      - name: Verify AI process files and OpenSpec change
        env:
          BASE_REF: origin/${{ github.base_ref }}
          ALLOW_OPENSPEC_EXEMPT: ${{ steps.exempt.outputs.exempt }}
        run: bash scripts/verify-ai-process.sh

  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build backend
        run: mvn clean install -DskipTests -pl '!backstage-flink'

      - name: Verify jar exists
        run: test -f backstage-admin/target/backstage-admin.jar
