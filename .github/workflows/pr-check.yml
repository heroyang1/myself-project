name: PR Build Check

on:
  pull_request:
    branches:
      - 'qa/**'
      - 'release/**'
      - 'main'
      - 'master'

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true


env:
  JAVA_VERSION: '17'

jobs:
  process-guard:
    name: Secret Scan & PR Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title (Conventional Commits)
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request?.title || '';
            // 与 AGENTS.md 提交规范对齐：feat|fix|refactor|docs|test|chore 等 type + 可选 scope + !（BREAKING）
            const pattern = /^(feat|fix|refactor|docs|test|chore|build|perf|ci|style|revert)(\([^)]+\))?!?: .+/;
            if (!pattern.test(title)) {
              core.setFailed(
                `PR title does not match Conventional Commits: "${title}"\n` +
                `Required format: <type>(<scope>)?: <subject>, e.g. "fix(group): CAS失败后退款重复触发"\n` +
                `Allowed types: feat fix refactor docs test chore build perf ci style revert`
              );
            }

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # 扫描 PR 引入的 commit，拦截 token/密码/私钥入仓（AGENTS.md 禁则的机器拦截点）。
        # 组织（Organization）账户需额外配置 repo/org secret: GITLEAKS_LICENSE；个人账户可省略。
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run core test suites
        run: >
          mvn test -pl backstage-common,backstage-framework,backstage-system,backstage-admin -am
          -Dtest='PaymentScenarioTest,GroupBuyingScenarioTest,SecurityBoundaryTest,BoundaryValueTest,MiddlewareFailoverTest,EquivalenceClassTest,ConcurrencySafetyTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

      # 断言 ArchUnit 护栏文件与冻结基线目录均已入 git 索引；
      # 保留下方 failIfNoSpecifiedTests=false 让多模块聚合不误伤，但"测试失踪即静默跳过"由本步骤兜住。
      - name: Assert ArchUnit test files present
        run: |
          missing=0
          for f in \
            backstage-admin/src/test/java/com/backstage/architecture/LayeredArchitectureTest.java \
            backstage-admin/src/test/java/com/backstage/architecture/CodingConventionArchitectureTest.java; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::$f 缺失；ArchUnit 护栏失效，禁止静默跳过。请 git add 后重新提交。"
              missing=1
            fi
          done
          if [ ! -d backstage-admin/archunit-store ]; then
            echo "::error::FreezingArchRule 基线目录 backstage-admin/archunit-store/ 缺失；首次运行会现建基线把当时全部存量洗白。请本地跑 mvn -B test -pl backstage-admin -am -Dtest='*ArchitectureTest' 生成后 git add 提交。"
            missing=1
          fi
          exit $missing

      # 架构护栏（ArchUnit）：分层方向 + 编码约定，失败即阻断 PR
      - name: Architecture guardrail (ArchUnit)
        run: >
          mvn -B test -pl backstage-admin -am
          -Dtest='LayeredArchitectureTest,CodingConventionArchitectureTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Build backend
        run: mvn clean install -DskipTests -pl '!backstage-flink'

      - name: Verify jar exists
        run: test -f backstage-admin/target/backstage-admin.jar
